<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2444"/>
      <stop offset="100%" stop-color="#1E3A66"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="480" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="376" height="456" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Certified Badge -->
  <g transform="translate(200, 52)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#FCD34D" letter-spacing="1">금융감독원 공인 등록</text>
  </g>

  <!-- Central Seal Crest -->
  <g transform="translate(200, 165)" filter="url(#softGlow)">
    <!-- Outer Seal Ring -->
    <circle r="72" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6, 3"/>
    <circle r="64" fill="#0A182E" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <!-- Scale of Justice / Professional Damage Adjuster Emblem -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -5)">
      <!-- Central Pillar -->
      <line x1="0" y1="-32" x2="0" y2="30"/>
      <!-- Scale Beam -->
      <line x1="-34" y1="-18" x2="34" y2="-18"/>
      <!-- Left Pan -->
      <path d="M-34 -18 L-42 6 L-26 6 Z"/>
      <path d="M-46 6 Q-34 16 -22 6"/>
      <!-- Right Pan -->
      <path d="M34 -18 L26 6 L42 6 Z"/>
      <path d="M22 6 Q34 16 46 6"/>
      <!-- Base -->
      <line x1="-18" y1="30" x2="18" y2="30"/>
      <circle cx="0" cy="-32" r="3.5" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Title & Credentials -->
  <text x="200" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    김병수 손해사정사
  </text>
  
  <text x="200" y="306" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#93C5FD">
    국민대 대학원 · 삼성화재 경력 · 신체손해사정 20년 이상
  </text>

  <!-- Divider Line -->
  <line x1="60" y1="330" x2="340" y2="330" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Info Details -->
  <g transform="translate(200, 362)">
    <rect x="-155" y="-18" width="310" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
      등록번호: 제 G0001628호 · 사업자: 208-14-53073
    </text>
  </g>

  <g transform="translate(200, 412)">
    <rect x="-155" y="-18" width="310" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="13" font-weight="600" fill="#93C5FD">
      업무 지역 : 전국 어디든 가능
    </text>
  </g>

  <text x="200" y="456" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
    배상책임보험 특화 · 사망사고·중상해 핵심 강점 · 전문인 배상책임보험 가입
  </text>
</svg>
